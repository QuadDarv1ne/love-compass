# Logrotate configuration for PM2/Node.js logs
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/love-compass

/app/love-compass/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0644 nextjs nextjs
    sharedscripts
    postrotate
        # Signal PM2 to reopen log files
        pm2 reloadLogs > /dev/null 2>&1 || true
    endscript
}

# For Docker json-file logs (handled via docker-compose logging options)
# See docker-compose.prod.yml: max-size: "10m", max-file: "3"
