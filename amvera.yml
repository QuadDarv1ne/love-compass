meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  additionalCommands: echo 'DATABASE_URL=file:./db/custom.db' > .env && echo 'JWT_SECRET=amvera-production-secret-change-me' >> .env && mkdir -p db && npx prisma generate && npx prisma db push && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && cp .env .next/standalone/.env

run:
  command: NODE_ENV=production DATABASE_URL=file:./db/custom.db JWT_SECRET=amvera-production-secret-change-me node .next/standalone/server.js
  containerPort: 3000
